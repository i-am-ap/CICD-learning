name: CI Pipeline
on:
  push:
    branches: [main, setup]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build Docker image
        run: docker build -t cicd-app:${{ github.sha }} .
      - name: Run container
        run: docker run -d -p 3001:3001 --name test-container cicd-app:${{ github.sha }}
      - name: Wait for app to be ready
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3001; then
              echo "App is up!"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done
          echo "App never became ready"
          docker logs test-container
          exit 1