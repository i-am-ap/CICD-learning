name: CI Pipeline              # display name in GitHub UI

on:                            # trigger — what starts this pipeline
  push:
    branches: [main, setup]
  pull_request:
    branches: [main]

jobs:
  build-and-test:              # job name (you choose this)
    runs-on: ubuntu-latest      # the runner OS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4    # pulls your repo onto the runner

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Docker image
        run: docker build -t cicd-app:${{ github.sha }} .

      - name: Run container and test it responds
        run: |
          docker run -d -p 3000:3000 cicd-app:${{ github.sha }}
          sleep 2
          curl --fail http://localhost:3000